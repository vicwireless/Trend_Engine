  payload:
    title: 2027 Weekly Planner Printable, Minimal Week-by-Week Pages, Letter and A4 PDF
    description: 'A calm, minimal 2027 weekly planner you print at home: one page per week, with room for seven days, your
      top 3 priorities and notes.


      WHAT YOU GET

      • US Letter PDF (8.5 x 11 in), weeks start Sunday

      • A4 PDF (210 x 297 mm), weeks start Monday

      • 53 weekly pages in each size, covering all of 2027

      • A how-to-print guide (PDF)


      Print at 100% / "Actual size". Matte cardstock (65-110 lb) is best for writing on. It''s mostly white space, so it''s
      light on ink.


      PLEASE NOTE

      This is a digital download. Nothing will be shipped. Colors may vary slightly by printer. For personal use only; please
      don''t resell or share the files. Designed by the seller with AI-assisted tools (code-generated layout); see shop policies.'
