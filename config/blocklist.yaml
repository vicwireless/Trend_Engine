    - john anderson
  song_lyrics:
    - shake it off
    - all too well
    - bohemian rhapsody
  attributed_quotes:
    # Quote text attributed to a person is blocked regardless of whether the name appears.
    - be the change you wish to see
    - keep calm and carry on
  universities:
    - harvard
    - yale
    - stanford
    - princeton
    - notre dame
    - alabama crimson tide
  military_insignia:
    - usmc
    - marine corps
    - navy seal
    - army ranger
    - 82nd airborne
    - semper fi
  national_park_logos:
    - nps arrowhead
    - national park service
    - find your park
  # Memes tied to an identifiable creator, photo subject or rights holder (docs/ip-screen.md).
  # Rule: ride a trend's sentiment, occasion or look; never sell the meme itself.
  meme_owned:
    - grumpy cat
    - nyan cat
    - keyboard cat
    - doge
    - pepe the frog
    - distracted boyfriend
    - hide the pain harold
    - success kid
    - bad luck brian
    - disaster girl
    - overly attached girlfriend
    - this is fine
    - skibidi toilet
    - let's go brandon

regex:
  # Lookalike / workaround spellings and generic risk patterns.
  - name: trademark_symbols
    pattern: '[™®©]'
  - name: meme_template
    pattern: '\b(meme template|reaction (image|gif)|as seen on tiktok|viral (sound|audio))\b'
  - name: inspired_by_hedge
    pattern: '\b(inspired by|in the style of|dupe|lookalike|knock[- ]?off|parody of)\b'
  - name: disney_lookalike
    pattern: '\bd[i1!]sn[e3]y\b'
  - name: swiftie
    pattern: '\bswift(ie|ies)\b'
  - name: team_city_football
    pattern: '\b((chicago|detroit|green bay|kansas city|dallas|philadelphia) football|bears football)\b'
  - name: team_mascot_city
    pattern: '\b(chiefs|eagles|cowboys|lakers|yankees|dodgers|packers|49ers)\b'
  - name: lyric_marker
    pattern: '\b(lyrics?|song quote)\b'
  - name: quote_attribution
    pattern: '["“].{3,120}["”]\s*[-–—]\s*[A-Z][a-z]+'
    case_sensitive: true
