# IP blocklist. Any hit = veto (CLAUDE.md rule 3). Uncertainty = veto too; record the reason.
# Terms are matched case-insensitively on whole words. Regexes use Python `re` syntax with IGNORECASE.
# See config/README.md for how to extend.

version: 1
categories:
  brands:
    - disney
    - nike
    - adidas
    - coca-cola
    - starbucks
    - lego
    - barbie
    - hello kitty
    - stanley cup
