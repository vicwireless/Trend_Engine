# PENDING, NOT EXECUTABLE. Kept outside releases/ on purpose: git's 'releases/*.yaml' pattern also matches
# subfolders, so anything under releases/ is treated as a real manifest by CI and the executor.
# The engine completes it and moves it to releases/ once the blockers below are cleared. See docs/pod-holiday-2026.md.
#
# Why it is not ready to merge, stated plainly (2026-11-16):
#   1. api.printify.com and printify.com are blocked from the engine's cloud session, and there is no
#      PRINTIFY_READ_TOKEN / PRINTIFY_WRITE_TOKEN. So blueprint ids, print provider ids, variant ids, base
#      costs, shipping and 2026 holiday cutoff dates could not be fetched. They are null here on purpose:
#      CLAUDE.md rule 6 allows prices only from dated cost snapshots, and guessing ids would fail closed anyway.
#   2. printify_create_product needs Printify image ids in print_areas. The executor has no image-upload op
#      yet; it will be added (POST /v1/uploads/images.json) when a token exists to test it against.
#   3. printify_publish needs partner_checked: true, i.e. the owner has connected the Etsy shop inside
#      Printify and Printify appears as production partner on the listing.
#   4. Phrase check: only generic greetings and the game name "Christmas Bingo" are used. The tag lines
#      "warm wishes, hot cocoa" and "free space is for snacks" still need the trademark check in class 021 / 025.
status: pending
manifest_id: 2026-11-16-pod-holiday
niche: seasonal-party-games
needs:
  - PRINTIFY_WRITE_TOKEN and PRINTIFY_SHOP_ID secrets (owner)
  - Etsy shop connected inside Printify (owner)
  - cost snapshot data/costs/<date>-printify-holiday.json fetched from the Printify catalog (engine, once reachable)
  - provider holiday cutoff confirmed inside the processing window (engine, once reachable)
