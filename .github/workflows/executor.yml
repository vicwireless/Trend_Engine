name: executor

# Runs ONLY when a merge to main adds or changes a release manifest. The PR merge is the approval
# record (CLAUDE.md; autonomy mode since 2026-11-15, docs/autonomy.md). No schedule, no manual
# trigger, no other paths.
on:
  push:
    branches: [main]
    paths:
      - "releases/*.yaml"

concurrency:
  group: executor
  cancel-in-progress: false

permissions:
  contents: write        # to push the ledger branch
  pull-requests: write   # to open the 'ledger:' PR (playbook SP-07); main stays protected

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # pushes go through .github/scripts/data_pr.sh with an explicit token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Find changed manifests
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD^"; fi
          files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'releases/*.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Manifests: $files"

      - name: Verify the owner merged this (approval record)
        # Owner's rule: merge-only, no review count. A direct push or a merge by anyone not in
        # approval.owner_logins is not approval, so nothing runs (playbook SP-07).
        id: approval
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit-to-PRs list omits merged_by, so fetch each PR in full.
          for n in $(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].number'); do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$n"
          done | jq -s . | python -m src.executor.approval "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Refuse to run while ledger data is unmerged
        # Ceilings, cool-downs and idempotency read the ledger on main. A run with an unmerged
        # ledger PR, or a ledger branch that never got a PR, would undercount, so fail closed
        # (CLAUDE.md rule 8).
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --search "ledger: in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "Unmerged ledger PR(s) exist; merge them, then re-run."; exit 1; fi
          for b in $(git ls-remote --heads origin 'ledger/*' | sed 's#.*refs/heads/##'); do
            prs=$(gh pr list --state all --head "$b" --json number --jq 'length')
            if [ "$prs" = "0" ]; then echo "Ledger branch $b has no pull request yet; open and merge it, then re-run."; exit 1; fi
          done

      - name: Execute
        if: steps.changed.outputs.files != ''
        env:
          APPROVER: ${{ steps.approval.outputs.approver }}
          MERGE_SHA: ${{ github.sha }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_WRITE_REFRESH_TOKEN: ${{ secrets.ETSY_WRITE_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          PRINTIFY_WRITE_TOKEN: ${{ secrets.PRINTIFY_WRITE_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          # Etsy rotates the refresh token on every refresh and revokes the old one. The client writes
          # the newest one here; the next step saves it back to the secret. (Not doing this is what
          # left a dead write token after the 2026-10-26 release; incident 2026-11-16.)
          ETSY_ROTATED_REFRESH_FILE: ${{ runner.temp }}/etsy_write_refresh
        run: python -m src.executor.run ${{ steps.changed.outputs.files }}

      - name: Save the rotated Etsy write token to the secret
        if: always() && steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.METRICS_SECRETS_PAT }}   # fine-grained PAT, this repo only, Secrets: read and write
        run: |
          f="$RUNNER_TEMP/etsy_write_refresh"
          if [ ! -s "$f" ]; then echo "No rotated token to save."; exit 0; fi
          echo "::add-mask::$(cat "$f")"
          if [ -z "$GH_TOKEN" ]; then
            rm -f "$f"
            echo "::error::METRICS_SECRETS_PAT is not set, so the rotated Etsy write token was not saved. The next release will fail with 'refresh_token is revoked'."; exit 1
          fi
          gh secret set ETSY_WRITE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          rm -f "$f"
          echo "Rotated Etsy write token saved to ETSY_WRITE_REFRESH_TOKEN."

      - name: Push the ledger branch and merge it if an owner token allows (data only)
        if: always() && steps.changed.outputs.files != ''
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          ENGINE_PAT: ${{ secrets.METRICS_SECRETS_PAT }}
        run: |
          git config user.name "trend-engine-executor"
          git config user.email "executor@users.noreply.github.com"
          git add data/ledger reports/incidents
          if git diff --cached --quiet; then exit 0; fi
          branch="ledger/${GITHUB_SHA::12}"
          git checkout -b "$branch"
          git commit -m "ledger: ${GITHUB_SHA::12}"
          echo "Executor ledger and incidents for merge ${GITHUB_SHA}. Touches data/ledger and reports/incidents only." > "$RUNNER_TEMP/ledger_body.md"
          .github/scripts/data_pr.sh "$branch" "ledger: ${GITHUB_SHA::12}" "$RUNNER_TEMP/ledger_body.md"
